  }
];

let current = 0;

function renderSlide(index) {
  current = index;
  const slide = slides[index];
  
  // 渲染內容
  let content = '';
  for (const block of slide.blocks) {
    if (block.type === 'text') {
      for (const item of block.content) {
        if (item.type === 'paragraph') {
          const alignMap = {'LEFT':'left','CENTER':'center','RIGHT':'right','JUSTIFY':'justify'};
          const align = alignMap[item.alignment] || 'left';
          let runsHtml = '';
          for (const r of item.runs) {
            let styleParts = [];
            for (const [k, v] of Object.entries(r.styles)) styleParts.push(k + ':' + v);
            const styleStr = styleParts.join('; ');
            const text = r.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            if (styleStr) runsHtml += '<span style="' + styleStr + '">' + text + '</span>';
            else runsHtml += text;
          }
          content += '<p style="text-align:' + align + '; margin:6px 0; line-height:1.7">' + runsHtml + '</p>';
        }
      }
    } else if (block.type === 'table') {
      content += '<table style="width:100%; border-collapse:collapse; margin:10px 0; font-size:11pt">';
      for (let ri = 0; ri < block.rows.length; ri++) {
        const tag = ri === 0 ? 'th' : 'td';
        let cells = '';
        for (const c of block.rows[ri]) {
          const safe = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          cells += '<' + tag + ' style="border:1px solid #ddd; padding:6px 10px; text-align:left">' + safe + '</' + tag + '>';
        }
        const bg = ri === 0 ? 'background:#1a3a5c; color:#fff' : '';
        content += '<tr style="' + bg + '">' + cells + '</tr>';
      }
      content += '</table>';
    }
  }
  
  document.getElementById('slideCard').innerHTML = 
    '<h2>' + slide.title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</h2>' +
    '<span class="slide-number">第 ' + (index+1) + ' / ' + slides.length + ' 頁</span>' +
    content;
  
  document.getElementById('pageInfo').textContent = (index + 1) + ' / ' + slides.length;
  
  document.querySelectorAll('#toc li').forEach((li, i) => {
    li.classList.toggle('active', i === index);
    if (i === index) li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  
  // Scroll to top of content
  document.getElementById('slideViewer').scrollTop = 0;
}

function buildToc() {
  const ul = document.getElementById('toc');
  slides.forEach((slide, i) => {
    const li = document.createElement('li');
    const title = slide.title.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    li.innerHTML = '<span class="num">' + String(i+1).padStart(2,'0') + '</span>' + title;
    li.onclick = () => renderSlide(i);
    ul.appendChild(li);
  });
}

function nextSlide() { if (current < slides.length - 1) renderSlide(current + 1); }
function prevSlide() { if (current > 0) renderSlide(current - 1); }
function goFirst() { renderSlide(0); }
function goLast() { renderSlide(slides.length - 1); }

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.querySelector('.main').requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
  if (e.key === 'Home') goFirst();
  if (e.key === 'End') goLast();
});

buildToc();
renderSlide(0);
</script>
