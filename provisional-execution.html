<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假執行被廢棄之法律問題</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", sans-serif;
  background: #0a1628;
  overflow: hidden;
  height: 100vh;
  user-select: none;
}

/* ── Slide View ── */
.slide-wrapper {
  position: relative;
  width: 100vw;
  height: calc(100vh - 64px);
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0a1628;
}

.slide-frame {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.slide-frame img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: opacity 0.35s ease;
  border-radius: 2px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.4);
}

/* ── Navigation Bar ── */
.nav-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: linear-gradient(180deg, rgba(10,22,40,0.98), rgba(15,36,64,1));
  border-top: 1px solid rgba(212,175,55,0.2);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  z-index: 100;
  padding: 0 24px;
}

.nav-btn {
  background: transparent;
  color: #d4af37;
  border: 1px solid rgba(212,175,55,0.4);
  padding: 8px 20px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-btn:hover {
  background: rgba(212,175,55,0.15);
  border-color: #d4af37;
}
.nav-btn:disabled {
  opacity: 0.25;
  cursor: not-allowed;
  border-color: rgba(212,175,55,0.1);
}

.nav-indicator {
  color: #8fa8c8;
  font-size: 14px;
  letter-spacing: 0.05em;
  min-width: 100px;
  text-align: center;
}

.nav-indicator .total { color: #5a7a9a; }

/* ── Thumbnail Strip ── */
.thumb-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  max-width: 400px;
  padding: 4px 8px;
  scrollbar-width: thin;
  scrollbar-color: rgba(212,175,55,0.3) transparent;
}
.thumb-strip::-webkit-scrollbar { height: 3px; }
.thumb-strip::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.4); border-radius: 2px; }

.thumb-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(212,175,55,0.2);
  border: none;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s;
}
.thumb-dot.active { background: #d4af37; transform: scale(1.3); }
.thumb-dot:hover { background: rgba(212,175,55,0.5); }

/* ── TOC ── */
.toc-btn {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 200;
  background: rgba(212,175,55,0.9);
  color: #1a365d;
  border: none;
  width: 44px;
  height: 44px;
  font-size: 20px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 16px rgba(0,0,0,0.35);
  transition: all 0.2s;
}
.toc-btn:hover { background: #d4af37; transform: scale(1.05); }

.toc-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 300;
  display: none;
}
.toc-overlay.show { display: block; }

.toc-panel {
  position: fixed;
  top: 0;
  right: -420px;
  width: 400px;
  height: 100vh;
  background: #0f2440;
  z-index: 350;
  transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
  padding: 24px 20px;
  box-shadow: -4px 0 30px rgba(0,0,0,0.4);
}
.toc-panel.open { right: 0; }

.toc-panel h2 {
  color: #d4af37;
  font-size: 18px;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.toc-panel .toc-subtitle {
  color: #8fa8c8;
  font-size: 12px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(212,175,55,0.15);
}

.toc-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  color: #cbd5e0;
  cursor: pointer;
  border-radius: 6px;
  font-size: 14px;
  margin-bottom: 3px;
  transition: all 0.15s;
}
.toc-item:hover { background: #1a365d; }
.toc-item.active {
  background: rgba(212,175,55,0.12);
  color: #d4af37;
  border-left: 3px solid #d4af37;
}
.toc-item .num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(212,175,55,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #8fa8c8;
  flex-shrink: 0;
}
.toc-item.active .num {
  background: #d4af37;
  color: #1a365d;
}
.toc-item .label {
  line-height: 1.3;
}
.toc-item .label .en {
  display: block;
  font-size: 11px;
  color: #6a8aaa;
}

/* ── Controls hint ── */
.hint {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.3);
  font-size: 12px;
  letter-spacing: 0.1em;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s;
}
.hint.show { opacity: 1; }

/* ── Loading ── */
.loading {
  position: fixed;
  inset: 0;
  background: #0a1628;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 999;
  transition: opacity 0.5s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.loading .spinner {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(212,175,55,0.15);
  border-top-color: #d4af37;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading p {
  color: #8fa8c8;
  font-size: 14px;
  margin-top: 16px;
  letter-spacing: 0.05em;
}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>載入簡報中…</p>
</div>

<!-- Slide Container -->
<div class="slide-wrapper" id="slideWrapper">
  <div class="slide-frame" id="slideFrame">
    <img id="slideImg" src="" alt="Slide" />
  </div>
</div>

<!-- TOC Button -->
<button class="toc-btn" id="tocBtn" title="目錄">☰</button>

<!-- TOC Overlay -->
<div class="toc-overlay" id="tocOverlay"></div>

<!-- TOC Panel -->
<div class="toc-panel" id="tocPanel">
  <h2>📋 目錄</h2>
  <div class="toc-subtitle">假執行被廢棄之法律問題 · 15 張幻灯片</div>
  <div id="tocList"></div>
</div>

<!-- Navigation Bar -->
<div class="nav-bar">
  <button class="nav-btn" id="prevBtn">◀ 上一張</button>

  <div class="thumb-strip" id="thumbStrip"></div>

  <div class="nav-indicator">
    <span id="currentPage">1</span>
    <span class="total">/ 15</span>
  </div>

  <button class="nav-btn" id="nextBtn">下一張 ▶</button>
</div>

<!-- Hint -->
<div class="hint" id="hint">← → 方向鍵切換 · ☰ 目錄快速跳轉</div>

<script>
// ── Slide Data ──
const TOTAL = 15;
const SLIDE_NAMES = [
  "封面",
  "目錄",
  "案例事實概述",
  "案件時間軸",
  "本案爭點",
  "假執行制度概說",
  "假執行宣告之效力與廢棄",
  "民事訴訟法第395條解析",
  "提存法第18條第1項第2款",
  "擔保物返還時點",
  "損害賠償請求權基礎",
  "損害期間計算原則",
  "實務見解（一）",
  "實務見解（二）",
  "結論",
];

const SLIDE_EN = [
  "Cover",
  "Table of Contents",
  "Case Facts Overview",
  "Case Timeline",
  "Key Issues",
  "Provisional Execution System",
  "Effect & Revocation",
  "Article 395 CPC Analysis",
  "Article 18 Deposit Law",
  "Recovery Time Point",
  "Damage Claim Basis",
  "Damage Period Calculation",
  "Judicial Precedent (1)",
  "Judicial Precedent (2)",
  "Conclusion",
];

let current = 0;
let preloaded = new Set();

// ── DOM refs ──
const img = document.getElementById('slideImg');
const currentSpan = document.getElementById('currentPage');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const thumbStrip = document.getElementById('thumbStrip');
const tocList = document.getElementById('tocList');
const tocBtn = document.getElementById('tocBtn');
const tocPanel = document.getElementById('tocPanel');
const tocOverlay = document.getElementById('tocOverlay');
const loading = document.getElementById('loading');
const hint = document.getElementById('hint');

// ── Build Thumb Strip ──
for (let i = 1; i <= TOTAL; i++) {
  const dot = document.createElement('button');
  dot.className = 'thumb-dot' + (i === 1 ? ' active' : '');
  dot.dataset.index = i - 1;
  dot.addEventListener('click', () => goTo(i - 1));
  thumbStrip.appendChild(dot);
}

// ── Build TOC ──
for (let i = 0; i < TOTAL; i++) {
  const item = document.createElement('div');
  item.className = 'toc-item' + (i === 0 ? ' active' : '');
  item.innerHTML = `<span class="num">${i + 1}</span><span class="label">${SLIDE_NAMES[i]}<span class="en">${SLIDE_EN[i]}</span></span>`;
  item.addEventListener('click', () => { goTo(i); closeToc(); });
  tocList.appendChild(item);
}

// ── Image URL helper ──
function imgUrl(n) {
  const num = String(n + 1).padStart(2, '0');
  return 'images/provisional-execution/slide-' + num + '.png';
}

// ── Preload Image ──
function preload(n) {
  if (preloaded.has(n)) return;
  const a = new Image();
  a.src = imgUrl(n);
  preloaded.add(n);
}

// ── Go To Slide ──
function goTo(n) {
  if (n < 0 || n >= TOTAL) return;
  current = n;
  img.style.opacity = '0';
  setTimeout(() => {
    img.src = imgUrl(n);
    img.style.opacity = '1';
  }, 150);

  // Update UI
  currentSpan.textContent = n + 1;
  prevBtn.disabled = n === 0;
  nextBtn.disabled = n === TOTAL - 1;

  // Dots
  document.querySelectorAll('.thumb-dot').forEach((d, i) => {
    d.classList.toggle('active', i === n);
  });
  // Scroll dot into view
  const activeDot = document.querySelector('.thumb-dot.active');
  if (activeDot) activeDot.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

  // TOC
  document.querySelectorAll('.toc-item').forEach((item, i) => {
    item.classList.toggle('active', i === n);
  });

  // Preload neighbors
  preload(n + 1);
  preload(n - 1);
  preload(n + 2);
  preload(n - 2);
}

// ── TOC ──
function openToc() {
  tocPanel.classList.add('open');
  tocOverlay.classList.add('show');
}
function closeToc() {
  tocPanel.classList.remove('open');
  tocOverlay.classList.remove('show');
}
tocBtn.addEventListener('click', () => {
  if (tocPanel.classList.contains('open')) closeToc();
  else openToc();
});
tocOverlay.addEventListener('click', closeToc);

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && current > 0) { goTo(current - 1); e.preventDefault(); }
  if (e.key === 'ArrowRight' && current < TOTAL - 1) { goTo(current + 1); e.preventDefault(); }
  if (e.key === 'Home') { goTo(0); e.preventDefault(); }
  if (e.key === 'End') { goTo(TOTAL - 1); e.preventDefault(); }
  if (e.key === 'Escape') closeToc();
});

// ── Buttons ──
prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

// ── Touch swipe ──
let touchStartX = 0;
document.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', (e) => {
  const diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 60) {
    if (diff > 0) goTo(current + 1);
    else goTo(current - 1);
  }
});

// ── Init ──
preload(0);
preload(1);
img.src = imgUrl(0);
img.style.opacity = '1';

setTimeout(() => {
  loading.classList.add('hidden');
}, 400);

setTimeout(() => {
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 4000);
}, 1500);
</script>
</body>
</html>
