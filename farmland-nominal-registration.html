    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #0f3460;
        }
        .sidebar-header h1 {
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .sidebar-header p {
            font-size: 12px;
            color: #aaa;
            line-height: 1.5;
        }
        .toc {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .toc-item {
            display: block;
            padding: 8px 12px;
            color: #ddd;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .toc-item:hover, .toc-item.active {
            background: #0f3460;
            color: #fff;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .slide-viewer {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }
        .slide {
            display: none;
            max-width: 100%;
            max-height: 100%;
        }
        .slide.active {
            display: block;
        }
        .slide img {
            max-width: 100%;
            max-height: calc(100vh - 120px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
        .controls {
            height: 80px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 0 20px;
        }
        .controls button {
            background: #0f3460;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .controls button:hover {
            background: #e94560;
        }
        .controls button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .page-info {
            font-size: 14px;
            color: #aaa;
            min-width: 100px;
            text-align: center;
        }
        .menu-toggle {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: #0f3460;
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -260px;
                top: 0;
                bottom: 0;
                z-index: 999;
                transition: left 0.3s;
            }
            .sidebar.open {
                left: 0;
            }
            .menu-toggle {
                display: block;
            }
            .slide img {
                max-height: calc(100vh - 140px);
            }
        }
    </style>
</head>

            <div class="controls">
                <button id="prevBtn" onclick="prevSlide()">← 上一張</button>
                <span class="page-info" id="pageInfo">1 / 26</span>
                <button id="nextBtn" onclick="nextSlide()">下一張 →</button>
            </div>
        </main>
    </div>
    <script>
        let currentSlide = 1;
        const totalSlides = 26;

        function showSlide(n) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.toc-item').forEach(t => t.classList.remove('active'));
            const slide = document.getElementById('slide-' + n);
            const toc = document.querySelector('.toc-item[data-slide="' + n + '"]');
            if (slide) slide.classList.add('active');
            if (toc) toc.classList.add('active');
            document.getElementById('pageInfo').textContent = n + ' / ' + totalSlides;
            document.getElementById('prevBtn').disabled = n === 1;
            document.getElementById('nextBtn').disabled = n === totalSlides;
            currentSlide = n;
            if (toc) toc.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function nextSlide() {
            if (currentSlide < totalSlides) showSlide(currentSlide + 1);
        }

        function prevSlide() {
            if (currentSlide > 1) showSlide(currentSlide - 1);
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
            if (e.key === 'ArrowLeft') prevSlide();
        });

        document.querySelectorAll('.toc-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                showSlide(parseInt(this.dataset.slide));
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('open');
                }
            });
        });

        showSlide(1);
    </script>
