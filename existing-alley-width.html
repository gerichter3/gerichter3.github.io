body{font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;background:#11111f;overflow:hidden;height:100vh;}
.slide{display:none;width:100vw;height:100vh;align-items:center;justify-content:center;}

.controls .nav-btn:hover{background:rgba(255,255,255,.18);}
.controls .nav-btn:disabled{opacity:.3;cursor:default;}
.toc-toggle{position:fixed;top:16px;right:16px;background:rgba(17,17,31,.8);border:1px solid rgba(255,255,255,.15);color:#aaa;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.85rem;z-index:200;font-family:inherit;}

.toc-panel h3{font-size:.95rem;color:#c8a84b;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.toc-item{display:block;padding:8px 12px;margin-bottom:4px;border-radius:4px;cursor:pointer;font-size:.82rem;color:#bbb;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:background .15s,color .15s;}
.toc-item:hover{background:rgba(200,168,75,.12);color:#fff;}
.toc-item.active{background:rgba(200,168,75,.2);color:#c8a84b;font-weight:600;}
.toc-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250;display:none;}
.toc-overlay.show{display:block;}
.key-hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#888;padding:6px 18px;border-radius:20px;font-size:.75rem;z-index:50;pointer-events:none;opacity:0;transition:opacity .5s;}
.key-hint.show{opacity:1;}
@media (max-width:768px){
  .controls .info{font-size:.72rem;}
  .controls .nav-btn{padding:6px 12px;font-size:.8rem;}
  .toc-panel{width:300px;right:-320px;}
}

  <div class="info"><span id="currentPage">1</span> / <span>34</span> &nbsp;·&nbsp; 現有巷道寬度認定</div>

  <button class="nav-btn" id="nextBtn" onclick="nextSlide()">下一頁 ›</button></div>

<script>
const TOTAL=34, DOC_TITLE="現有巷道寬度認定";
let current=0;
const slidesEl=document.querySelectorAll('.slide');
const bar=document.getElementById('progressBar');
const cur=document.getElementById('currentPage');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
function updateSlide(){
  slidesEl.forEach((el,i)=>el.classList.toggle('active',i===current));
  cur.textContent=current+1;
  bar.style.width=((current+1)/TOTAL*100)+'%';
  prevBtn.disabled=current===0;
  nextBtn.disabled=current===TOTAL-1;
  document.title=(current+1)+'/'+TOTAL+' · '+DOC_TITLE;
  document.querySelectorAll('.toc-item').forEach((el,i)=>el.classList.toggle('active',i===current));
  try{history.replaceState(null,'','#p='+(current+1));}catch(e){}
}
function nextSlide(){if(current<TOTAL-1){current++;updateSlide();}}
function prevSlide(){if(current>0){current--;updateSlide();}}
function goTo(n){current=n;updateSlide();closeToc();}
function toggleToc(){document.getElementById('tocPanel').classList.toggle('open');document.getElementById('tocOverlay').classList.toggle('show');}
function closeToc(){document.getElementById('tocPanel').classList.remove('open');document.getElementById('tocOverlay').classList.remove('show');}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'||e.key==='PageUp')prevSlide();
  else if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();nextSlide();}
  else if(e.key==='t'||e.key==='T')toggleToc();
  else if(e.key==='Escape')closeToc();
  else if(e.key==='Home'){current=0;updateSlide();}
  else if(e.key==='End'){current=TOTAL-1;updateSlide();}
  else if(e.key==='f'||e.key==='F'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}
});
document.addEventListener('click',function(e){
  if(e.target.closest('a,button'))return;
  const r=e.clientX/window.innerWidth;
  if(r>0.7)nextSlide(); else if(r<0.3)prevSlide();
});
let tx=0;
document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;});
document.addEventListener('touchend',e=>{const d=tx-e.changedTouches[0].screenX;if(Math.abs(d)>50){d>0?nextSlide():prevSlide();}});
function readHash(){const m=location.hash.match(/p=(\d+)/);if(m){const v=parseInt(m[1],10)-1;if(v>=0&&v<TOTAL)current=v;}}
window.addEventListener('hashchange',()=>{readHash();updateSlide();});
setTimeout(()=>document.getElementById('keyHint').classList.add('show'),2000);
setTimeout(()=>document.getElementById('keyHint').classList.remove('show'),7000);
readHash();updateSlide();
</script>
