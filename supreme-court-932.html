<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最高法院111台上大字第932號 — 大法庭裁定分析</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; background: #1a1a2e; color: #fff; overflow: hidden; height: 100vh; }
  
  .container { display: flex; height: 100vh; }
  
  .sidebar { width: 280px; background: #16213e; padding: 16px 0; overflow-y: auto; flex-shrink: 0; border-right: 1px solid #0f3460; }
  .sidebar h3 { padding: 0 16px 14px; font-size: 14px; color: #e94560; border-bottom: 1px solid #0f3460; letter-spacing: 0.05em; }
  .sidebar ul { list-style: none; }
  .sidebar li { padding: 9px 16px; cursor: pointer; font-size: 13px; color: #a0a0b0; border-left: 3px solid transparent; transition: all 0.2s; word-break: break-all; line-height: 1.4; }
  .sidebar li:hover { background: #1a1a3e; color: #fff; }
  .sidebar li.active { background: #1a1a3e; color: #e94560; border-left-color: #e94560; font-weight: bold; }
  .sidebar li .num { color: #555; font-size: 11px; margin-right: 6px; }
  
  .main { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  
  .slide-viewer { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; overflow: auto; background: #0f3460; }
  .slide-viewer img { max-width: 100%; max-height: calc(100vh - 100px); object-fit: contain; border-radius: 4px; box-shadow: 0 4px 30px rgba(0,0,0,0.4); }
  
  .nav-bar { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 20px; background: #16213e; border-top: 1px solid #0f3460; flex-shrink: 0; }
  .nav-bar button { background: #0f3460; color: #fff; border: none; padding: 7px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.2s; min-width: 80px; }
  .nav-bar button:hover { background: #e94560; }
  .nav-bar .page-info { font-size: 14px; color: #a0a0b0; min-width: 100px; text-align: center; }
  .nav-bar .title-display { font-size: 13px; color: #c2cfe0; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  
  .fullscreen-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; z-index: 10; }
  .fullscreen-btn:hover { background: rgba(255,255,255,0.18); }
  
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 2px; }
  
  @media (max-width: 768px) { .sidebar { width: 180px; } .sidebar li { font-size: 12px; padding: 7px 12px; } }
  @media (max-width: 480px) { .container { flex-direction: column; } .sidebar { width: 100%; height: 120px; border-right: none; border-bottom: 1px solid #0f3460; } }
</style>
</head>
<body>
<div class="container">
  <div class="sidebar" id="sidebar">
    <h3>最高法院 111台上大字第932號</h3>
    <ul id="toc"></ul>
  </div>
  <div class="main">
    <button class="fullscreen-btn" onclick="toggleFullscreen()">[全螢幕]</button>
    <div class="slide-viewer" id="slideViewer">
      <img id="slideImage" src="" alt="投影片">
    </div>
    <div class="nav-bar">
      <button onclick="goFirst()">|◀ 首頁</button>
      <button onclick="prevSlide()">◀ 上一張</button>
      <span class="page-info" id="pageInfo">1 / 1</span>
      <button onclick="nextSlide()">下一張 ▶</button>
      <button onclick="goLast()">末頁 ▶|</button>
    </div>
  </div>
</div>

<script>
const slides = [
  {
    "index": 0,
    "title": "最高法院",
    "img": "slides/slide_01.png"
  },
  {
    "index": 1,
    "title": "投影片 2",
    "img": "slides/slide_02.png"
  },
  {
    "index": 2,
    "title": "本案基礎事實 — 當事人關係",
    "img": "slides/slide_03.png"
  },
  {
    "index": 3,
    "title": "投影片 4",
    "img": "slides/slide_04.png"
  },
  {
    "index": 4,
    "title": "事實時間線",
    "img": "slides/slide_05.png"
  },
  {
    "index": 5,
    "title": "法律爭議",
    "img": "slides/slide_06.png"
  },
  {
    "index": 6,
    "title": "投影片 7",
    "img": "slides/slide_07.png"
  },
  {
    "index": 7,
    "title": "大法庭推理結構總覽",
    "img": "slides/slide_08.png"
  },
  {
    "index": 8,
    "title": "階段一 — 占有的定義",
    "img": "slides/slide_09.png"
  },
  {
    "index": 9,
    "title": "階段一 — 為何承租人也占有土地",
    "img": "slides/slide_10.png"
  },
  {
    "index": 10,
    "title": "投影片 11",
    "img": "slides/slide_11.png"
  },
  {
    "index": 11,
    "title": "階段一 — 矛盾推論",
    "img": "slides/slide_12.png"
  },
  {
    "index": 12,
    "title": "投影片 13",
    "img": "slides/slide_13.png"
  },
  {
    "index": 13,
    "title": "投影片 14",
    "img": "slides/slide_14.png"
  },
  {
    "index": 14,
    "title": "階段二 — 不當得利分析架構",
    "img": "slides/slide_15.png"
  },
  {

  },
  {
    "index": 24,

    "img": "slides/slide_25.png"
  },
  {
    "index": 25,

    "img": "slides/slide_26.png"
  },
  {
    "index": 26,
    "title": "投影片 27",
    "img": "slides/slide_27.png"
  },
  {
    "index": 27,
    "title": "謝謝",
    "img": "slides/slide_28.png"
  }
];

let current = 0;

function renderSlide(index) {
  current = index;
  const slide = slides[index];
  document.getElementById('slideImage').src = slide.img;
  document.getElementById('pageInfo').textContent = `${index + 1} / ${slides.length}`;
  
  document.querySelectorAll('#toc li').forEach((li, i) => {
    li.classList.toggle('active', i === index);
    if (i === index) {
      li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  });
}

function buildToc() {
  const ul = document.getElementById('toc');
  slides.forEach((slide, i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span>${slide.title}`;
    li.onclick = () => renderSlide(i);
    ul.appendChild(li);
  });
}

function nextSlide() { if (current < slides.length - 1) renderSlide(current + 1); }
function prevSlide() { if (current > 0) renderSlide(current - 1); }
function goFirst() { renderSlide(0); }
function goLast() { renderSlide(slides.length - 1); }

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.querySelector('.main').requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// 鍵盤事件
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
  if (e.key === 'Home') goFirst();
  if (e.key === 'End') goLast();
});

buildToc();
renderSlide(0);
</script>
</body>
</html>
