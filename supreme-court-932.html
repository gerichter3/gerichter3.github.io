let current = 0;

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderSlide(index) {
  current = index;
  const slide = slides[index];
  document.getElementById('slideContent').innerHTML = slide.html;
  document.getElementById('pageInfo').textContent = `${index + 1} / ${slides.length}`;
  
  // 更新側邊欄高亮
  document.querySelectorAll('#toc li').forEach((li, i) => {
    li.classList.toggle('active', i === index);
    li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

function buildToc() {
  const ul = document.getElementById('toc');
  slides.forEach((slide, i) => {
    const li = document.createElement('li');
    li.textContent = slide.title;
    li.onclick = () => renderSlide(i);
    ul.appendChild(li);
  });
}

function nextSlide() {
  if (current < slides.length - 1) renderSlide(current + 1);
}

function prevSlide() {
  if (current > 0) renderSlide(current - 1);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.querySelector('.main').requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// 鍵盤事件
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextSlide();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevSlide();
  if (e.key === 'Home') renderSlide(0);
  if (e.key === 'End') renderSlide(slides.length - 1);
});

buildToc();
renderSlide(0);
</script>
