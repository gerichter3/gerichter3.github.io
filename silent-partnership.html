<script>
const TOTAL = 33;
let current = 0;
const slidesEl = document.querySelectorAll('.slide');
const progressBar = document.getElementById('progressBar');
const currentPage = document.getElementById('currentPage');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
function updateSlide() {
  slidesEl.forEach((el,i)=>el.classList.toggle('active', i===current));
  currentPage.textContent = current+1;
  progressBar.style.width = ((current+1)/TOTAL*100)+'%';
  prevBtn.disabled = current===0;
  nextBtn.disabled = current===TOTAL-1;
  document.querySelectorAll('.toc-item').forEach((el,i)=>{el.classList.toggle('active', i===current);});
}
function nextSlide() { if(current<TOTAL-1){current++;updateSlide();} }
function prevSlide() { if(current>0){current--;updateSlide();} }
function goTo(n) { current=n; updateSlide(); closeToc(); }
function toggleToc() { document.getElementById('tocPanel').classList.toggle('open'); document.getElementById('tocOverlay').classList.toggle('show'); }
function closeToc() { document.getElementById('tocPanel').classList.remove('open'); document.getElementById('tocOverlay').classList.remove('show'); }
document.addEventListener('keydown', function(e) {
  if(e.key==='ArrowLeft') prevSlide();
  else if(e.key==='ArrowRight') nextSlide();
  else if(e.key==='t'||e.key==='T') toggleToc();
  else if(e.key==='Escape') closeToc();
});
let touchStartX=0;
document.addEventListener('touchstart', e=>{touchStartX=e.changedTouches[0].screenX;});
document.addEventListener('touchend', e=>{
  const diff=touchStartX-e.changedTouches[0].screenX;
  if(Math.abs(diff)>50){ if(diff>0) nextSlide(); else prevSlide(); }
});
setTimeout(()=>document.getElementById('keyHint').classList.add('show'),2000);
setTimeout(()=>document.getElementById('keyHint').classList.remove('show'),8000);
updateSlide();
</script>
